<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dodge the Buildings</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      background: linear-gradient(to bottom, #3c0066, #220033);
      color: white;
    }
    canvas {
      display: block;
      background: transparent;
    }
    #ui {
      position: absolute;
      width: 100%;
      top: 0;
      text-align: center;
      z-index: 10;
      color: white;
    }
    #startScreen, #gameOverScreen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    button, select {
      padding: 10px;
      font-size: 18px;
      margin: 10px;
      border-radius: 10px;
      border: none;
    }
    #scoreBoard {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="scoreBoard">Score: 0 | High Score: 0</div>
  </div>

  <div id="startScreen">
    <h1>Dodge the Buildings</h1>
    <label for="planeSelect">Choose Your Plane:</label>
    <select id="planeSelect">
      <option value="plane1.png">Green Plane</option>
      <option value="plane2.png">Red Plane</option>
    </select>
    <button id="startBtn">Start Game</button>
    <button id="toggleSound">Toggle Sound</button>
    <button onclick="window.close()">Exit</button>
  </div>

  <div id="gameOverScreen" style="display:none;">
    <h1>Game Over</h1>
    <p id="finalScore"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <canvas id="gameCanvas" width="480" height="640"></canvas>

  <audio id="bgm" src="bgm.mp3" loop></audio>
  <audio id="crashSound" src="crash.mp3"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let bird = { x: 100, y: 150, width: 40, height: 30, velocity: 0 };
    let gravity = 0.6;
    let lift = -10;
    let pipes = [];
    let score = 0;
    let highScore = localStorage.getItem("highScore") || 0;
    let planeImg = new Image();
    let planeSelected = "plane1.png";
    let crashed = false;
    let explosion = new Image();
    explosion.src = "explosion.gif";
    let showExplosion = false;
    let explosionTimer = 0;

    const bgm = document.getElementById("bgm");
    const crashSound = document.getElementById("crashSound");

    function drawSky() {
      ctx.fillStyle = "#3c0066";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Crescent Moon
      ctx.beginPath();
      ctx.arc(420, 80, 25, 0, Math.PI * 2, false);
      ctx.fillStyle = "yellow";
      ctx.fill();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(430, 80, 25, 0, Math.PI * 2, false);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      // Stars
      for (let i = 0; i < 40; i++) {
        ctx.fillStyle = "white";
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
      }
    }

    function drawPlane() {
      if (!showExplosion) ctx.drawImage(planeImg, bird.x, bird.y, bird.width, bird.height);
    }

    function drawExplosion() {
      if (showExplosion) {
        ctx.drawImage(explosion, bird.x - 15, bird.y - 15, 60, 60);
        explosionTimer++;
        if (explosionTimer > 20) document.getElementById("gameOverScreen").style.display = "flex";
      }
    }

    function drawBuildings() {
      ctx.fillStyle = "black";
      pipes.forEach(pipe => {
        // Rectangle base
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);

        // Triangle top
        ctx.beginPath();
        ctx.moveTo(pipe.x, pipe.top);
        ctx.lineTo(pipe.x + pipe.width / 2, pipe.top - 20);
        ctx.lineTo(pipe.x + pipe.width, pipe.top);
        ctx.fill();

        // Windows
        for (let y = 10; y < pipe.top; y += 15) {
          ctx.fillStyle = "yellow";
          ctx.fillRect(pipe.x + 5, y, 3, 3);
        }
        for (let y = pipe.bottom + 10; y < canvas.height; y += 15) {
          ctx.fillStyle = "yellow";
          ctx.fillRect(pipe.x + 5, y, 3, 3);
        }
      });
    }

    function update() {
      if (crashed) return;

      bird.velocity += gravity;
      bird.y += bird.velocity;

      pipes.forEach(pipe => {
        pipe.x -= 2;

        // Collision
        if (
          bird.x < pipe.x + pipe.width &&
          bird.x + bird.width > pipe.x &&
          (bird.y < pipe.top || bird.y + bird.height > pipe.bottom)
        ) {
          crashSound.play();
          crashed = true;
          showExplosion = true;
          bgm.pause();
        }

        if (!pipe.passed && pipe.x + pipe.width < bird.x) {
          pipe.passed = true;
          score++;
          document.getElementById("scoreBoard").textContent = `Score: ${score} | High Score: ${Math.max(score, highScore)}`;
        }
      });

      // Remove old pipes
      pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

      // Add new pipe
      if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
        let top = Math.random() * 200 + 50;
        let gap = 150;
        pipes.push({ x: canvas.width, width: 50, top: top, bottom: top + gap, passed: false });
      }

      if (bird.y + bird.height > canvas.height || bird.y < 0) {
        crashed = true;
        showExplosion = true;
        bgm.pause();
        crashSound.play();
      }
    }

    function draw() {
      drawSky();
      drawBuildings();
      drawPlane();
      drawExplosion();
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (e.code === "Space") bird.velocity = lift;
    });

    document.addEventListener("touchstart", () => {
      bird.velocity = lift;
    });

    document.getElementById("startBtn").onclick = () => {
      document.getElementById("startScreen").style.display = "none";
      setTimeout(() => {
        planeSelected = document.getElementById("planeSelect").value;
        planeImg.src = planeSelected;
        bgm.play();
        gameLoop();
      }, 5000);
    };

    document.getElementById("toggleSound").onclick = () => {
      if (bgm.muted) {
        bgm.muted = false;
        crashSound.muted = false;
      } else {
        bgm.muted = true;
        crashSound.muted = true;
      }
    };

    window.addEventListener("beforeunload", () => {
      localStorage.setItem("highScore", Math.max(score, highScore));
    });

    document.getElementById("finalScore").textContent = `Score: ${score} | High Score: ${Math.max(score, highScore)}`;
  </script>
</body>
</html>
