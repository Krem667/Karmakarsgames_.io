<!DOCTYPE html><html>
<head>
  <title>Airplane Game</title>
  <style>
    canvas {
      display: block;
      margin: 0 auto;
      background: linear-gradient(to bottom, #4B0082, #2E0854);
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      color: white;
      background-color: black;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");let plane = { x: 50, y: 300, width: 50, height: 40, vy: 0 }; let buildings = []; let score = 0; let highScore = 0; let gameOver = false; let gameStarted = false; let waitingToStart = false; let bgm, crashSound;

const planeImg = new Image(); planeImg.src = "airplane1.png";

const explosionGif = new Image(); explosionGif.src = "explosion.gif";

function playSound(file) { const sound = new Audio(file); sound.play(); }

function startGame() { resetGame(); waitingToStart = true; playSound("bgm.mp3"); setTimeout(() => { waitingToStart = false; gameStarted = true; }, 5000); }

function resetGame() { plane = { x: 50, y: 300, width: 50, height: 40, vy: 0 }; buildings = []; score = 0; gameOver = false; gameStarted = false; }

function update() { if (gameOver) return;

if (!waitingToStart && gameStarted) {
  plane.vy += 0.5;
  plane.y += plane.vy;

  if (plane.y + plane.height > canvas.height || plane.y < 0) {
    triggerGameOver();
  }

  buildings.forEach(b => b.x -= 2);
  buildings = buildings.filter(b => b.x + b.width > 0);

  if (Math.random() < 0.02) {
    const height = Math.floor(Math.random() * 200 + 100);
    buildings.push({
      x: canvas.width,
      y: canvas.height - height,
      width: 50,
      height: height
    });
  }

  buildings.forEach(b => {
    if (
      plane.x < b.x + b.width &&
      plane.x + plane.width > b.x &&
      plane.y < b.y + b.height &&
      plane.y + plane.height > b.y
    ) {
      triggerGameOver();
    }
  });

  score++;
  if (score > highScore) highScore = score;
}

}

function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height);

// Sky background
ctx.fillStyle = "#4B0082";
ctx.fillRect(0, 0, canvas.width, canvas.height);

// Stars
ctx.fillStyle = "white";
for (let i = 0; i < 100; i++) {
  ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
}

// Moon
ctx.fillStyle = "yellow";
ctx.beginPath();
ctx.arc(canvas.width - 30, 50, 20, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = "#4B0082";
ctx.beginPath();
ctx.arc(canvas.width - 22, 50, 20, 0, Math.PI * 2);
ctx.fill();

drawBuildings();

if (!gameOver) {
  ctx.drawImage(planeImg, plane.x, plane.y, plane.width, plane.height);
} else {
  ctx.drawImage(explosionGif, plane.x, plane.y, 50, 50);
}

ctx.fillStyle = "white";
ctx.fillText("Score: " + Math.floor(score / 10) + " | High Score: " + Math.floor(highScore / 10), 10, 20);

}

function drawBuildings() { buildings.forEach(b => { // Building body ctx.fillStyle = "black"; ctx.fillRect(b.x, b.y, b.width, b.height);

// Triangle roof
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x + b.width / 2, b.y - 20);
  ctx.lineTo(b.x + b.width, b.y);
  ctx.closePath();
  ctx.fill();

  // Windows
  ctx.fillStyle = "yellow";
  for (let wy = b.y + 10; wy < b.y + b.height - 10; wy += 12) {
    ctx.fillRect(b.x + b.width / 2 - 2, wy, 4, 4);
  }
});

}

function triggerGameOver() { gameOver = true; gameStarted = false; playSound("crash.mp3"); }

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.addEventListener("keydown", e => { if (e.code === "Space") { if (!gameStarted && !waitingToStart) { startGame(); } if (!gameOver) { plane.vy = -8; } } });

loop(); </script>

</body>
</html>
