<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Dodger</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 700px;
        }
        
        canvas {
            background-color: #4a1d96;
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
        }
        
        #gameOverScreen {
            display: none;
        }
        
        button {
            margin: 10px;
            padding: 12px 24px;
            font-size: 18px;
            background-color: #9c27b0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #7b1fa2;
        }
        
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .planeOption {
            width: 50px;
            height: 50px;
            margin: 10px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .planeOption.selected {
            border-color: #9c27b0;
        }
        
        #planeSelection {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        
        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="scoreDisplay">0</div>
        
        <div id="startScreen">
            <h1>Sky Dodger</h1>
            <p>Dodge the skyscrapers!</p>
            
            <div id="planeSelection">
                <div class="planeOption selected" data-plane="pixel">
                    <svg width="50" height="50" viewBox="0 0 50 50">
                        <polygon points="25,5 45,25 25,35 5,25" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="planeOption" data-plane="sprite1">
                    <svg width="50" height="50" viewBox="0 0 50 50">
                        <path d="M25,5 L45,20 L35,25 L45,30 L25,45 L20,35 L5,30 L15,25 L5,20 Z" fill="#ff9800"/>
                    </svg>
                </div>
                <div class="planeOption" data-plane="sprite2">
                    <svg width="50" height="50" viewBox="0 0 50 50">
                        <path d="M25,5 L40,15 L35,25 L40,35 L25,45 L20,35 L5,25 L20,15 Z" fill="#2196f3"/>
                    </svg>
                </div>
            </div>
            
            <button id="startButton">Start Game</button>
        </div>
        
        <div id="gameOverScreen">
            <h1>Game Over</h1>
            <p id="finalScore">Score: 0</p>
            <p id="highScore">High Score: 0</p>
            <button id="playAgainButton">Play Again</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const playAgainButton = document.getElementById('playAgainButton');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const highScoreDisplay = document.getElementById('highScore');
        const planeOptions = document.querySelectorAll('.planeOption');
        
        // Set canvas size
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let selectedPlane = 'pixel';
        let countdown = 3;
        
        // Game objects
        const plane = {
            x: 0,
            y: 0,
            width: 40,
            height: 40,
            speed: 5
        };
        
        let buildings = [];
        let stars = [];
        let explosions = [];
        let countdownInterval;
        
        // Initialize stars for background
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    opacity: Math.random()
                });
            }
        }
        
        // Create a new building
        function createBuilding() {
            const width = Math.random() * 80 + 40;
            const gap = Math.random() * 200 + 150;
            
            buildings.push({
                x: canvas.width,
                width: width,
                gap: gap,
                passed: false
            });
        }
        
        // Draw the plane based on selected type
        function drawPlane() {
            ctx.save();
            ctx.translate(plane.x, plane.y);
            
            if (selectedPlane === 'pixel') {
                // Pixelated plane
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(plane.width/2, 0);
                ctx.lineTo(plane.width, plane.height/2);
                ctx.lineTo(plane.width/2, plane.height/1.5);
                ctx.lineTo(0, plane.height/2);
                ctx.closePath();
                ctx.fill();
            } else if (selectedPlane === 'sprite1') {
                // Sprite 1
                ctx.fillStyle = '#ff9800';
                ctx.beginPath();
                ctx.moveTo(plane.width/2, 0);
                ctx.lineTo(plane.width, plane.height/3);
                ctx.lineTo(plane.width/1.5, plane.height/2);
                ctx.lineTo(plane.width, plane.height/1.5);
                ctx.lineTo(plane.width/2, plane.height);
                ctx.lineTo(plane.width/2.5, plane.height/1.5);
                ctx.lineTo(0, plane.height/1.5);
                ctx.lineTo(plane.width/5, plane.height/2);
                ctx.lineTo(0, plane.height/3);
                ctx.closePath();
                ctx.fill();
            } else if (selectedPlane === 'sprite2') {
                // Sprite 2
                ctx.fillStyle = '#2196f3';
                ctx.beginPath();
                ctx.moveTo(plane.width/2, 0);
                ctx.lineTo(plane.width, plane.height/3);
                ctx.lineTo(plane.width/1.25, plane.height/2);
                ctx.lineTo(plane.width, plane.height/1.5);
                ctx.lineTo(plane.width/2, plane.height);
                ctx.lineTo(plane.width/2.5, plane.height/1.5);
                ctx.lineTo(0, plane.height/2);
                ctx.lineTo(plane.width/2.5, plane.height/3);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // Draw buildings
        function drawBuildings() {
            buildings.forEach(building => {
                // Draw building
                ctx.fillStyle = '#000000';
                ctx.fillRect(building.x, 0, building.width, canvas.height);
                
                // Draw triangular top
                ctx.beginPath();
                ctx.moveTo(building.x, 0);
                ctx.lineTo(building.x + building.width, 0);
                ctx.lineTo(building.x + building.width/2, -30);
                ctx.closePath();
                ctx.fill();
                
                // Draw windows
                ctx.fillStyle = '#ffeb3b';
                const windowSize = 8;
                const windowGap = 15;
                
                for (let y = 20; y < canvas.height - 20; y += windowGap) {
                    for (let x = building.x + 10; x < building.x + building.width - 10; x += windowGap) {
                        if (Math.random() > 0.3) { // Random windows
                            ctx.fillRect(x, y, windowSize, windowSize);
                        }
                    }
                }
            });
        }
        
        // Draw background with stars and moon
        function drawBackground() {
            // Violet-purple background
            ctx.fillStyle = '#4a1d96';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw moon
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(canvas.width - 60, 60, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Crescent effect
            ctx.fillStyle = '#4a1d96';
            ctx.beginPath();
            ctx.arc(canvas.width - 70, 60, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }
        
        // Draw countdown before game starts
        function drawCountdown() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(countdown.toString(), canvas.width/2, canvas.height/2);
        }
        
        // Create explosion effect
        function createExplosion(x, y) {
            const particles = 30;
            for (let i = 0; i < particles; i++) {
                explosions.push({
                    x: x,
                    y: y,
                    size: Math.random() * 5 + 2,
                    speedX: (Math.random() - 0.5) * 10,
                    speedY: (Math.random() - 0.5) * 10,
                    color: ['#ff0000', '#ff9900', '#ffff00'][Math.floor(Math.random() * 3)],
                    life: 30
                });
            }
        }
        
        // Draw explosions
        function drawExplosions() {
            explosions.forEach((particle, index) => {
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                
                // Update particle
                particle.x += particle.speedX;
                particle.y += particle.speedY;
                particle.life--;
                
                // Remove dead particles
                if (particle.life <= 0) {
                    explosions.splice(index, 1);
                }
            });
        }
        
        // Check for collisions
        function checkCollision() {
            for (const building of buildings) {
                if (
                    plane.x < building.x + building.width &&
                    plane.x + plane.width > building.x &&
                    plane.y < canvas.height &&
                    plane.y + plane.height > 0
                ) {
                    return true;
                }
            }
            return false;
        }
        
        // Update game state
        function update() {
            // Move buildings
            buildings.forEach(building => {
                building.x -= 3;
                
                // Check if plane passed the building
                if (!building.passed && plane.x > building.x + building.width) {
                    building.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                }
            });
            
            // Remove buildings that are off screen
            buildings = buildings.filter(building => building.x + building.width > 0);
            
            // Add new buildings
            if (buildings.length === 0 || buildings[buildings.length - 1].x < canvas.width - buildings[buildings.length - 1].gap) {
                createBuilding();
            }
            
            // Check for collision
            if (checkCollision()) {
                gameOver();
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            createExplosion(plane.x + plane.width/2, plane.y + plane.height/2);
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }
            
            // Show game over screen after explosion animation
            setTimeout(() => {
                finalScoreDisplay.textContent = `Score: ${score}`;
                highScoreDisplay.textContent = `High Score: ${highScore}`;
                gameOverScreen.style.display = 'flex';
            }, 1000);
        }
        
        // Reset game
        function resetGame() {
            score = 0;
            scoreDisplay.textContent = '0';
            buildings = [];
            explosions = [];
            plane.x = canvas.width / 4;
            plane.y = canvas.height / 2 - plane.height / 2;
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0,
