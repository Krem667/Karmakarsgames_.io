<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dodge the Buildings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    canvas { display: block; background: #2e0057; }
    body { font-family: monospace; text-align: center; overflow: hidden; }
    #ui {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 10px;
    }
    .button {
      padding: 10px 20px;
      font-size: 18px;
      background-color: #ff4d4d;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    #selectPlane, #startBtn, #soundBtn, #exitBtn {
      display: block;
    }
    #gameOverText {
      position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
      color: white; font-size: 24px; display: none;
    }
    #explosion {
      position: absolute;
      width: 100px; height: 100px;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="360" height="640"></canvas>

  <div id="ui">
    <button id="startBtn" class="button">Start</button>
    <select id="selectPlane">
      <option value="airplane1.png">Green Plane</option>
    </select>
    <button id="soundBtn" class="button">Sound: ON</button>
    <button id="exitBtn" class="button">Exit</button>
  </div>

  <div id="gameOverText">Game Over<br>Score: <span id="score">0</span> | High Score: <span id="highScore">0</span><br>
    <button class="button" onclick="location.reload()">Play Again</button>
  </div>

  <img id="explosion" src="explosion.gif" />

  <audio id="bgm" src="bgm.mp3" loop></audio>
  <audio id="crash" src="crash.mp3"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("startBtn");
    const selectPlane = document.getElementById("selectPlane");
    const soundBtn = document.getElementById("soundBtn");
    const explosionImg = document.getElementById("explosion");
    const gameOverText = document.getElementById("gameOverText");

    const bgm = document.getElementById("bgm");
    const crash = document.getElementById("crash");

    let planeImg = new Image();
    let plane = { x: 80, y: 200, width: 40, height: 30, vy: 0 };

    let buildings = [];
    let stars = [];
    let moon = { x: 300, y: 40 };

    let score = 0;
    let highScore = 0;
    let gameStarted = false;
    let gameOver = false;
    let soundOn = true;

    selectPlane.onchange = () => {
      planeImg.src = selectPlane.value;
    };

    planeImg.src = selectPlane.value;

    function drawBackground() {
      ctx.fillStyle = "#2e0057";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = "white";
      stars.forEach(s => ctx.fillRect(s.x, s.y, 2, 2));

      // Crescent Moon
      ctx.beginPath();
      ctx.arc(moon.x, moon.y, 20, 0, Math.PI * 2);
      ctx.fillStyle = "yellow";
      ctx.fill();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(moon.x + 8, moon.y, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawBuildings() {
      ctx.fillStyle = "black";
      buildings.forEach(b => {
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + b.height);
        ctx.lineTo(b.x + b.width / 2, b.y);
        ctx.lineTo(b.x + b.width, b.y + b.height);
        ctx.closePath();
        ctx.fill();

        // Windows
        ctx.fillStyle = "yellow";
        for (let wy = b.y + 10; wy < b.y + b.height - 10; wy += 12) {
          ctx.fillRect(b.x + b.width / 2 - 2, wy, 4, 4);
        }
        ctx.fillStyle = "black";
      });
    }

    function drawPlane() {
      ctx.drawImage(planeImg, plane.x, plane.y, plane.width, plane.height);
    }

    function resetGame() {
      plane.y = 200;
      plane.vy = 0;
      buildings = [];
      stars = [];
      for (let i = 0; i < 50; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height });
      score = 0;
      gameOver = false;
      gameOverText.style.display = "none";
      explosionImg.style.display = "none";
    }

    function startGame() {
      resetGame();
      setTimeout(() => gameStarted = true, 5000);
    }

    function update() {
      if (!gameStarted || gameOver) return;

      // Gravity
      plane.vy += 0.5;
      plane.y += plane.vy;

      // Buildings
      if (Math.random() < 0.02) {
        const height = Math.floor(Math.random() * 200 + 100);
        buildings.push({ x: canvas.width, y: canvas.height - height, width: 50, height: height });
      }

      buildings.forEach(b => b.x -= 2);
      buildings = buildings.filter(b => b.x + b.width > 0);

      buildings.forEach(b => {
        if (
          plane.x < b.x + b.width &&
          plane.x + plane.width > b.x &&
          plane.y + plane.height > b.y
        ) {
          // Collision
          gameOver = true;
          gameStarted = false;
          if (soundOn) crash.play();
          explosionImg.style.left = plane.x + "px";
          explosionImg.style.top = plane.y + "px";
          explosionImg.style.display = "block";
          gameOverText.style.display = "block";
          document.getElementById("score").textContent = score;
          highScore = Math.max(highScore, score);
          document.getElementById("highScore").textContent = highScore;
        }
      });

      // Scoring
      score++;
    }

    function render() {
      drawBackground();
      drawBuildings();
      if (!gameOver) drawPlane();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", () => {
      if (gameStarted && !gameOver) plane.vy = -8;
    });

    canvas.addEventListener("touchstart", () => {
      if (gameStarted && !gameOver) plane.vy = -8;
    });

    startBtn.onclick = () => {
      bgm.play();
      startGame();
      document.getElementById("ui").style.display = "none";
    };

    soundBtn.onclick = () => {
      soundOn = !soundOn;
      bgm.muted = !soundOn;
      crash.muted = !soundOn;
      soundBtn.textContent = "Sound: " + (soundOn ? "ON" : "OFF");
    };

    exitBtn.onclick = () => {
      alert("Thanks for playing!");
    };

    window.onload = () => {
      loop();
    };
  </script>
</body>
</html>
