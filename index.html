<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sky Flight</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #2c003e;
      font-family: monospace;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      background: linear-gradient(to top, #2c003e, #4b0082);
    }
    #info {
      position: fixed;
      width: 100%;
      text-align: center;
      top: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      z-index: 10;
      white-space: pre-line;
    }
    #restartBtn {
      display: none;
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      font-size: 20px;
      background: #ff4757;
      color: #fff;
      border: none;
      border-radius: 10px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="info">Tap or Press Space to Start</div>
  <canvas id="gameCanvas"></canvas>
  <button id="restartBtn">Play Again</button>

  <!-- Background music -->
  <audio id="bgm" loop>
    <source src="your-music.mp3" type="audio/mpeg" />
  </audio>

  <!-- Crash sound -->
  <audio id="crashSound">
    <source src="crash.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restartBtn");
    const bgm = document.getElementById("bgm");
    const crashSound = document.getElementById("crashSound");

    const airplaneImg = new Image(); // ADDED
    airplaneImg.src = "airplane.png"; // REPLACE with your sprite path

    let width = window.innerWidth, height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    let frames = 0, score = 0;
    let highScore = localStorage.getItem("skyFlightHighScore") || 0;
    let gameStarted = false, gameOver = false, exploded = false;

    const GRAVITY = 0.25 * (height / 600);
    const FLAP = -5 * (height / 600);

    const stars = Array.from({ length: 100 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height / 2,
      r: Math.random() * 2 + 1
    }));

    const particles = [];

    const bird = {
      x: width / 4,
      y: height / 2,
      w: 36,
      h: 18,
      velocity: 0,
      draw() {
        ctx.drawImage(airplaneImg, this.x, this.y, this.w, this.h); // ADDED

        // Keep original design as fallback or comment these out
        /*
        ctx.fillStyle = "#c0c0c0";
        ctx.fillRect(this.x, this.y + 6, 36, 6);
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(this.x + 4, this.y + 2, 8, 4);
        ctx.fillRect(this.x + 4, this.y + 12, 8, 4);
        ctx.fillStyle = "#000";
        ctx.fillRect(this.x + 28, this.y + 4, 4, 10);
        */
      },
      update() {
        this.velocity += GRAVITY;
        this.y += this.velocity;
        if (this.y + this.h > height || this.y < 0) triggerExplosion();
      },
      flap() {
        this.velocity = FLAP;
      },
      reset() {
        this.y = height / 2;
        this.velocity = 0;
      }
    };

    // ... rest of your code remains unchanged ...
  </script>
</body>
</html>
