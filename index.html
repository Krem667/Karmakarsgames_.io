<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sky Flight</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #2c003e;
      font-family: monospace;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      background: linear-gradient(to top, #2c003e, #4b0082);
    }
    #info {
      position: fixed;
      width: 100%;
      text-align: center;
      top: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      z-index: 10;
      white-space: pre-line;
    }
    #restartBtn, #startBtn, #soundBtn, #exitBtn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      font-size: 18px;
      background: #ff4757;
      color: #fff;
      border: none;
      border-radius: 10px;
      z-index: 20;
      display: none;
    }
    #restartBtn { bottom: 60px; }
    #startBtn { bottom: 140px; display: block; }
    #soundBtn { bottom: 200px; }
    #exitBtn { bottom: 260px; }
    #selector {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      display: block;
    }
  </style>
</head>
<body>
  <div id="info">Tap or Press Space to Start</div>
  <div id="selector">
    <label for="planeSelect">Choose your airplane:</label>
    <select id="planeSelect">
      <option value="airplane1.png">Airplane 1</option>
      <option value="airplane2.png">Airplane 2</option>
      <option value="airplane3.png">Airplane 3</option>
    </select>
  </div>
  <canvas id="gameCanvas"></canvas>
  <button id="startBtn">Start Game</button>
  <button id="soundBtn">Sound: On</button>
  <button id="exitBtn">Exit Game</button>
  <button id="restartBtn">Play Again</button>  <audio id="bgm" loop>
    <source src="your-music.mp3" type="audio/mpeg" />
  </audio>
  <audio id="crashSound">
    <source src="crash.mp3" type="audio/mpeg" />
  </audio>  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let airplaneImg = new Image();
    let selectedSprite = "airplane1.png";
    let airplaneLoaded = false;

    airplaneImg.onload = () => {
      airplaneLoaded = true;
    };

    document.getElementById('planeSelect').addEventListener('change', e => {
      selectedSprite = e.target.value;
      airplaneImg.src = selectedSprite;
    });
    airplaneImg.src = selectedSprite;

    const gravity = 0.6;
    const lift = -10;
    let gameStarted = false;
    let gameOver = false;
    let score = 0;
    let highScore = 0;
    let soundOn = true;

    const bird = {
      x: 150,
      y: 200,
      w: 64,
      h: 32,
      velocity: 0,
      draw() {
        if (!gameOver && airplaneLoaded) ctx.drawImage(airplaneImg, this.x, this.y, this.w, this.h);
      },
      update() {
        this.velocity += gravity;
        this.y += this.velocity;
        if (this.y + this.h > canvas.height || this.y < 0) crash();
      },
      flap() {
        this.velocity = lift;
      }
    };

    const pipes = [];
    const pipeWidth = 80;
    const gap = 200;
    let frame = 0;

    function drawBackground() {
      ctx.fillStyle = "#2c003e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(80, 80, 30, 0.5 * Math.PI, 1.5 * Math.PI);
      ctx.fill();
      for (let i = 0; i < 100; i++) {
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
      }
    }

    function createPipe() {
      const topHeight = Math.random() * (canvas.height - gap - 100) + 50;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        passed: false
      });
    }

    function drawPipes() {
      pipes.forEach(pipe => {
        ctx.fillStyle = "black";
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, pipeWidth, canvas.height - pipe.bottom);
        ctx.fillStyle = "yellow";
        for (let y = pipe.bottom + 10; y < canvas.height; y += 20) {
          ctx.fillRect(pipe.x + 10, y, 5, 5);
          ctx.fillRect(pipe.x + 30, y + 10, 5, 5);
        }
      });
    }

    function updatePipes() {
      pipes.forEach(pipe => {
        pipe.x -= 3;
        if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
          score++;
          pipe.passed = true;
        }
        if (
          bird.x < pipe.x + pipeWidth &&
          bird.x + bird.w > pipe.x &&
          (bird.y < pipe.top || bird.y + bird.h > pipe.bottom)
        ) {
          crash();
        }
      });
      if (frame % 100 === 0) createPipe();
    }

    function crash() {
      gameOver = true;
      document.getElementById("restartBtn").style.display = "block";
      document.getElementById("info").innerText = `Game Over\nScore: ${score}\nHigh Score: ${highScore}`;
      document.getElementById("bgm").pause();
      if (soundOn) document.getElementById("crashSound").play();
    }

    function reset() {
      pipes.length = 0;
      bird.y = 200;
      bird.velocity = 0;
      score = 0;
      frame = 0;
      gameOver = false;
      document.getElementById("restartBtn").style.display = "none";
      document.getElementById("info").innerText = "";
      airplaneImg.src = selectedSprite;
      if (soundOn) document.getElementById("bgm").play();
    }

    function animate() {
      if (!gameStarted) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawPipes();
      bird.update();
      bird.draw();
      updatePipes();
      frame++;
      if (!gameOver) {
        document.getElementById("info").innerText = `Score: ${score}`;
        requestAnimationFrame(animate);
      }
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("info").innerText = "Starting in 5...";
      document.getElementById("selector").style.display = "none";
      let countdown = 5;
      const interval = setInterval(() => {
        countdown--;
        document.getElementById("info").innerText = `Starting in ${countdown}...`;
        if (countdown === 0) {
          clearInterval(interval);
          document.getElementById("startBtn").style.display = "none";
          document.getElementById("soundBtn").style.display = "none";
          document.getElementById("exitBtn").style.display = "none";
          document.getElementById("info").innerText = "";
          gameStarted = true;
          if (soundOn) document.getElementById("bgm").play();
          reset();
          animate();
        }
      }, 1000);
    });

    document.getElementById("soundBtn").addEventListener("click", () => {
      soundOn = !soundOn;
      document.getElementById("soundBtn").innerText = `Sound: ${soundOn ? "On" : "Off"}`;
      const bgm = document.getElementById("bgm");
      if (soundOn) bgm.play();
      else bgm.pause();
    });

    document.getElementById("exitBtn").addEventListener("click", () => {
      location.reload();
    });

    window.addEventListener("keydown", e => {
      if (e.code === "Space") {
        if (!gameOver && gameStarted) bird.flap();
      }
    });

    canvas.addEventListener("touchstart", () => {
      if (!gameOver && gameStarted) bird.flap();
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      highScore = Math.max(score, highScore);
      reset();
      animate();
    });
  </script></body>
</html>
